<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>TESEO CAF Notification</title>
</head>
<body style="margin: 0; padding: 0; background-color: #f4f6f9; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;">
    
    <!-- Main Table -->
    <table border="0" cellpadding="0" cellspacing="0" width="100%" style="max-width: 600px; margin: 0 auto; background-color: #ffffff; border-radius: 8px; overflow: hidden; margin-top: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.05);">
        
        <!-- Header: Changed to TESEO colors -->
        <tr>
            <td style="padding: 30px; background-color: #58687e; text-align: center;">
                <h1 style="color: #ffffff; margin: 0; font-size: 24px; letter-spacing: 1px;">
                    TESEO <span style="color: #7ca0c8;">CAF</span>
                </h1>
            </td>
        </tr>

        <!-- Content -->
        <tr>
            <td style="padding: 40px 30px; color: #333333; line-height: 1.6; font-size: 16px;">
                {% block content %}{% endblock %}
            </td>
        </tr>

        <!-- Footer -->
        <tr>
            <td style="padding: 20px; background-color: #ecf0f1; text-align: center; font-size: 12px; color: #7f8c8d;">
                <p style="margin: 0;">&copy; {% now "Y" %} TESEO CAF Standard.</p>
                <p style="margin: 5px 0 0 0;">This is an automated message. Please do not reply.</p>
            </td>
        </tr>

    </table>

</body>
</html>
