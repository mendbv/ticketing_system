{% extends 'emails/base_email.html' %}

{% block content %}
    <h2 style="color: #58687e;">New Assignment</h2>
    <p>Hello {{ ticket.assigned_to.first_name }},</p>
    
    <p>You have been assigned to ticket <strong>#{{ ticket.ticket_number }}</strong>.</p>
    
    <table width="100%" style="margin: 20px 0; border: 1px solid #eee;">
        <tr>
            <td style="padding: 10px; background: #f9f9f9; width: 30%;">Service:</td>
            <td style="padding: 10px;">{{ ticket.service_name }}</td>
        </tr>
        <tr>
            <td style="padding: 10px; background: #f9f9f9;">Client:</td>
            <td style="padding: 10px;">{{ ticket.client.get_full_name }}</td>
        </tr>
    </table>

    <div style="text-align: center; margin-top: 30px;">
        <a href="{{ staff_url }}" style="background-color: #58687e; color: #ffffff; padding: 12px 25px; text-decoration: none; border-radius: 5px; font-weight: bold;">
            Process Ticket
        </a>
    </div>
{% endblock %}
