{% extends 'base.html' %}
{% load i18n %}
{% block content %}
<div class="card" style="text-align: center; max-width: 600px; margin: 50px auto; padding: 40px;">
    <i class="fa-solid fa-circle-check" style="font-size: 5rem; color: #27ae60; margin-bottom: 20px;"></i>
    <h1>{% trans "Payment Successful!" %}</h1>
    <p>{% trans "Thank you for your order. We have created tickets for your services." %}</p>
    <p>{% trans "Please upload the required documents in your dashboard." %}</p>
    <a href="{% url 'client_dashboard' %}" class="btn" style="margin-top: 20px;">
        {% trans "Go to My Tickets" %}
    </a>
</div>
{% endblock %}
