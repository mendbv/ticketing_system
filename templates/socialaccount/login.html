{% extends "base.html" %}
{% load i18n %}

{% block content %}
<div style="display: flex; justify-content: center; align-items: center; min-height: 60vh;">
    
    <div class="card" style="max-width: 500px; width: 100%; padding: 40px; text-align: center;">
        <div style="font-size: 3rem; color: #DB4437; margin-bottom: 20px;">
            <i class="fa-brands fa-google"></i>
        </div>
        
        <h2 style="margin-top: 0;">{% trans "Sign In via Google" %}</h2>
        
        <p style="color: #666; margin-bottom: 30px;">
            {% blocktrans with provider.name as provider %}You are about to sign in using a third-party account from {{ provider }}.{% endblocktrans %}
        </p>

        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn" style="background-color: #DB4437; color: white;">
                {% trans "Continue" %} <i class="fa-solid fa-arrow-right"></i>
            </button>
        </form>
    </div>

</div>
{% endblock %}
