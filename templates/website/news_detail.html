{% extends 'base.html' %}
{% load i18n %}

{% block content %}
<a href="{% url 'home' %}" class="btn btn-secondary" style="margin-bottom: 20px;"><i class="fa-solid fa-arrow-left"></i> {% trans "Back" %}</a>

<div class="card" style="max-width: 800px; margin: auto;">
    {% if news_item.image %}
        <img src="{{ news_item.image.url }}" style="width: 100%; max-height: 400px; object-fit: cover; border-radius: 8px; margin-bottom: 20px;">
    {% endif %}
    <h1>{{ news_item.title }}</h1>
    <p style="color: #777;">{{ news_item.created_at|date:"d M Y" }}</p>
    <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;">
    <div style="line-height: 1.6;">
        {{ news_item.content|linebreaks }}
    </div>
</div>
{% endblock %}
