{% extends 'account_base.html' %} <!-- ИЗМЕНЕНО -->
{% load i18n %}

{% block account_content %} <!-- ИЗМЕНЕНО -->
<div class="card" style="max-width: 600px;">
    <h2 style="margin-top: 0; border-bottom: 1px solid #eee; padding-bottom: 15px; margin-bottom: 25px;">
        {% trans "Profile Settings" %}
    </h2>

    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        
        <!-- Email (Read Only) -->
        <div style="margin-bottom: 20px;">
            <label>{% trans "Email Address" %}</label>
            <input type="text" value="{{ user.email }}" disabled style="background-color: #f8f9fa; color: #666; cursor: not-allowed;">
            <small style="color: #999;">{% trans "Email cannot be changed." %}</small>
        </div>

        {{ form.as_p }}

        <button type="submit" class="btn" style="margin-top: 20px;">
            <i class="fa-solid fa-floppy-disk"></i> {% trans "Save Changes" %}
        </button>
    </form>
</div>
{% endblock %}
